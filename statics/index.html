<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>MQ Usage Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Cache control meta tags -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- CSS and JS with cache busting -->
    <link rel="stylesheet" href="css/styles.css?v=1.7&t=20241019" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Load modules in dependency order -->
    <script src="js/utils.js?v=1.3&t=20241018"></script>
    <script src="js/auth.js?v=1.3&t=20241018"></script>
    <script src="js/api.js?v=1.5&t=20241018"></script>
    <script src="js/searchable-select.js?v=1.4&t=20241018"></script>
    <script src="js/table.js?v=1.4&t=20241018"></script>
    <script src="js/chart.js?v=1.3&t=20241018"></script>
</head>
<body>
<div class="header">
    <h1>MQ Usage Dashboard</h1>
    <button id="logout-btn">Logout</button>
</div>

<div class="search-panel">
    <label for="start-datetime">🗓️ Start Date & Time:</label>
    <input type="datetime-local" id="start-datetime" class="datetime-input" />
    <label for="end-datetime">🗓️ End Date & Time:</label>
    <input type="datetime-local" id="end-datetime" class="datetime-input" />
    <!-- Aggregate Mode Toggle -->
    <div class="checkbox-group">
        <input type="checkbox" id="all-funcs" />
        <label for="all-funcs">All MQ Functions (sum work_total)</label>
    </div>
    <label for="mq-function">MQ Function:</label>
    <div id="mq-function-container"></div>
    <label for="system-name">System Name:</label>
    <div id="system-name-container"></div>
    <div class="checkbox-group">
        <input type="checkbox" id="aggregate-systems" />
        <label for="aggregate-systems">Aggregate All Systems (รวมข้อมูลทุก System)</label>
    </div>
    <div id="system-names-container" style="display: block; margin-top: 10px;">
        <label>Select Systems to Display:</label>
        <div id="system-names-checkboxes"></div>
    </div>
    <label for="time-interval">⏱️ Time Interval (ช่วงเวลาเฉลี่ย):</label>
    <select id="time-interval" style="background-color: #e3f2fd; border: 2px solid #2196f3; font-weight: bold;">
        <option value="15" selected>15 นาที (Default)</option>
        <option value="30">30 นาที ⭐</option>
        <option value="60">1 ชั่วโมง</option>
        <option value="120">2 ชั่วโมง</option>
        <option value="240">4 ชั่วโมง</option>
    </select>
    <label for="grouping">Group By:</label>
    <select id="grouping">
        <option value="auto" selected>Auto</option>
        <option value="15min">15-Min Interval</option>
        <option value="daily">Daily</option>
        <option value="weekly">Weekly</option>
        <option value="monthly">Monthly</option>
    </select>
    <div class="checkbox-group">
        <input type="checkbox" id="show-peaks" />
        <label for="show-peaks">Show Monthly Peaks Only</label>
    </div>
    
    <!-- Peak Selection Mode -->
    <div class="peak-selection-container">
        <label class="peak-selection-label">
            <span class="label-icon">📊</span>
            <span class="label-text">Peak Selection Mode:</span>
        </label>
        <div class="peak-mode-options">
            <label class="radio-card">
                <input type="radio" name="peak-mode" value="all" checked />
                <span class="radio-content">
                    <span class="radio-icon">📈</span>
                    <span class="radio-title">All Days</span>
                    <span class="radio-desc">Show all daily peaks</span>
                </span>
            </label>
            <label class="radio-card">
                <input type="radio" name="peak-mode" value="specific" />
                <span class="radio-content">
                    <span class="radio-icon">🎯</span>
                    <span class="radio-title">Specific Days</span>
                    <span class="radio-desc">1st, 16th & Last day</span>
                </span>
            </label>
        </div>
    </div>
    
    <div class="btn-group">
        <button id="search-btn">Search</button>
        <button id="graph-btn">Generate Graph</button>
    </div>
</div>

<div class="tabs">
    <div class="tab-buttons">
        <button id="tab-search" class="active">Search Result</button>
        <button id="tab-graph">Graph</button>
    </div>
    <div id="tab-search-content" class="tab-content active">
        <div id="search-result"></div>
        <div class="pagination" id="pagination"></div>
    </div>
    <div id="tab-graph-content" class="tab-content">
        <div id="chart-container" style="position: relative; height: 600px; width: 100%; margin: 0; background-color: #ffffff; border-radius: 8px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); padding: 20px;">
            <canvas id="chart"></canvas>
        </div>
    </div>
</div>

<script src="js/scripts.js?v=3.0&t=20241019"></script>

<!-- Loading Overlay -->
<div id="loading-overlay" style="
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.7);
    z-index: 9999;
    justify-content: center;
    align-items: center;">
    <div style="text-align: center; color: white;">
        <div class="spinner"></div>
        <div id="loading-text" style="margin-top: 20px; font-size: 1.2rem; font-weight: bold;">
            Loading...
        </div>
        <div id="loading-subtext" style="margin-top: 10px; font-size: 0.9rem; opacity: 0.8;">
            Please wait while we process your data
        </div>
    </div>
</div>
</body>
</html>
